name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matlab-lint:
    name: MATLAB static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install miss_hit
        run: python -m pip install --upgrade pip miss_hit

      - name: Lint MATLAB sources
        run: mh_lint src tests config examples skills/cst-param-sweep/scripts run_sweep.m startup.m
